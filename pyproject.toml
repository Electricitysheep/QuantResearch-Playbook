[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "qrp"
version = "0.1.0"
description = "QuantResearch Playbook - 券商金工研报复现框架 | Chinese Brokerage Research Report Reproduction Framework"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "QuantResearch Playbook Contributors"},
]
keywords = ["quant", "quantitative-finance", "chinese-stocks", "factor-investing", "research-report"]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
]

dependencies = [
    "polars>=1.0",
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
    "matplotlib>=3.7",
    "seaborn>=0.12",
]

[project.optional-dependencies]
akshare = ["akshare>=1.14"]
full = [
    "akshare>=1.14",
    "plotly>=5.15",
    "rich>=13.0",
    "click>=8.0",
    "pyarrow>=12.0",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.1",
    "mypy>=1.0",
    "pre-commit>=3.0",
]
notebook = [
    "jupyter>=1.0",
    "ipykernel>=6.0",
]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[project.urls]
Homepage = "https://github.com/your-org/QuantResearch-Playbook"
Documentation = "https://github.com/your-org/QuantResearch-Playbook/docs"
Repository = "https://github.com/your-org/QuantResearch-Playbook"
